name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          tag="${GITHUB_REF_NAME}"
          expected_tag="v${version}"
          if [[ -z "$version" || "$tag" != "$expected_tag" ]]; then
            echo "Tag ${tag} does not match app version ${version}. Expected ${expected_tag}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=jianji-v${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub Actions secret for ${value}." >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          cat > signing.properties <<EOF
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Normalize APK name and generate checksum
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"
          sha256sum "${{ steps.version.outputs.apk_name }}" > "${{ steps.version.outputs.apk_name }}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.version.outputs.apk_name }}
            ${{ steps.version.outputs.apk_name }}.sha256
